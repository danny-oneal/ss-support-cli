[workspace]
resolver = "3"
members = ["crates/ss-core", "crates/ss-support"]

# One version for both crates, released together.
[workspace.package]
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/danny-oneal/ss-support-cli"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1.122"
aws-sdk-sts = "1.97"
base64 = "0.21"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
# Used through `ratatui::crossterm`; listed only to enable the async event stream.
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
globset = "0.4"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
# No `preserve_order`: sorted keys are what makes jsonutil::canonical canonical.
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "signal", "time", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
# dev
insta = "1"

[workspace.lints.rust]
unexpected_cfgs = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# A support tool's startup time is part of every invocation; release builds
# trade compile time for a smaller, faster static binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimize dependencies even in dev so the TDD loop is not dominated by
# debug-mode serde/tokio.
[profile.dev.package."*"]
opt-level = 3
