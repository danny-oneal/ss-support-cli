name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Clippy is warnings-as-errors and fmt is checked. MSRV builds in its own
  # job so a stable-only API use is a visible failure rather than a surprise
  # at release time.
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in step with `rust-version` in Cargo.toml [workspace.package].
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check on the minimum supported Rust
        run: cargo +1.88 check --workspace --all-targets --locked
