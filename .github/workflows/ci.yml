name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Clippy is warnings-as-errors and fmt is checked. MSRV builds in its own
  # job so a stable-only API use is a visible failure rather than a surprise
  # at release time.
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in step with `rust-version` in Cargo.toml [workspace.package].
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check on the minimum supported Rust
        run: cargo +1.88 check --workspace --all-targets --locked

  # The S3 adapter against a real versioned S3-compatible store.
  contract:
    name: S3 contract (MinIO)
    runs-on: ubuntu-latest
    env:
      # MinIO publishes no anonymously pullable image, so the server is built
      # from source at a pinned release.
      MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Cache MinIO build
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/minio
          key: minio-${{ env.MINIO_RELEASE }}-${{ runner.os }}

      - name: Install Go
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/.local/bin" go install "github.com/minio/minio@${MINIO_RELEASE}"

      - name: Start MinIO
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup "$HOME/.local/bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &

      - name: Wait for MinIO
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          exit 1

      - name: Contract suite
        env:
          SS_SUPPORT_S3_TEST_ENDPOINT: http://127.0.0.1:9000
        run: make contract

      - name: MinIO log
        if: failure()
        run: cat "$RUNNER_TEMP/minio.log" || true

  # The DynamoDB adapter against dynalite, a DynamoDB-compatible server.
  contract-ddb:
    name: DynamoDB contract (dynalite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start dynalite
        run: |
          nohup npx --yes dynalite@3.2.2 --port 8000 > "$RUNNER_TEMP/dynalite.log" 2>&1 &

      - name: Wait for dynalite
        run: |
          for _ in $(seq 1 60); do
            # Any HTTP status means the server is answering.
            curl -s -o /dev/null http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          echo "dynalite did not start" >&2
          exit 1

      - name: Contract suite
        env:
          SS_SUPPORT_DDB_TEST_ENDPOINT: http://127.0.0.1:8000
        run: make contract-ddb

      - name: dynalite log
        if: failure()
        run: cat "$RUNNER_TEMP/dynalite.log" || true
